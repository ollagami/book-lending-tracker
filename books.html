<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lent books</title>
  <!-- CSS library: Bootstrap -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="site-header">
    <nav class="navbar navbar-expand-md navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand fw-semibold" href="index.html">Book Lending Tracker</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#main-nav" aria-controls="main-nav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="main-nav">
          <ul class="navbar-nav me-auto">
            <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="add.html">Lend a book</a></li>
            <li class="nav-item"><a class="nav-link active" aria-current="page" href="books.html">Lent books</a></li>
            <li class="nav-item"><a class="nav-link" href="summary.html">Summary</a></li>
          </ul>
          <span class="navbar-text clock" id="clock">--:--:--</span>
        </div>
      </div>
    </nav>
  </header>

  <main class="container py-4">

    <section class="card shadow-sm">
      <div class="card-body">
        <div class="d-flex flex-column flex-md-row align-items-md-center justify-content-between gap-3 mb-3">
          <h2 class="h4 mb-0">Lent books <span class="badge text-bg-secondary align-middle" id="count"></span></h2>
          <div class="d-flex flex-column flex-sm-row gap-2">
            <input type="search" class="form-control" id="search" placeholder="Search title, author or borrower">
            <select class="form-select" id="filter-status">
              <option value="">All statuses</option>
              <option value="On loan">On loan</option>
              <option value="Overdue">Overdue</option>
              <option value="Returned">Returned</option>
            </select>
          </div>
        </div>

        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th scope="col">Title</th>
                <th scope="col">Author</th>
                <th scope="col">Borrower</th>
                <th scope="col">Due date</th>
                <th scope="col">Genre</th>
                <th scope="col">Status</th>
                <th scope="col" class="text-end">Action</th>
              </tr>
            </thead>
            <tbody id="loan-list">
              <!-- rows are rendered by books.js -->
            </tbody>
          </table>
        </div>

        <p class="text-secondary text-center py-4 mb-0" id="empty-message">
          No books lent yet. <a href="add.html">Lend one</a> or
          <button type="button" class="btn btn-link p-0 align-baseline" id="load-sample">load sample data</button>.
        </p>

        <div class="border-top pt-3 mt-3 text-end">
          <button type="button" class="btn btn-outline-danger" id="clear-all">Delete all loans</button>
        </div>
      </div>
    </section>

  </main>

  <!-- Edit modal: opened by JavaScript with bootstrap.Modal -->
  <div class="modal fade" id="edit-modal" tabindex="-1" aria-labelledby="edit-modal-title" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <form id="edit-form" novalidate>
          <div class="modal-header">
            <h2 class="modal-title h5" id="edit-modal-title">Edit loan</h2>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="edit-id">
              <div class="mb-3">
                <label for="edit-title" class="form-label">Title <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="edit-title" name="title" required>
                <div class="invalid-feedback error" data-for="title"></div>
              </div>
              <div class="mb-3">
                <label for="edit-author" class="form-label">Author <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="edit-author" name="author" required>
                <div class="invalid-feedback error" data-for="author"></div>
              </div>
              <div class="mb-3">
                <label for="edit-borrower" class="form-label">Borrower <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="edit-borrower" name="borrower" required>
                <div class="invalid-feedback error" data-for="borrower"></div>
              </div>
              <div class="mb-3">
                <label for="edit-dueDate" class="form-label">Due date <span class="text-danger">*</span></label>
                <input type="date" class="form-control" id="edit-dueDate" name="dueDate" required>
                <div class="invalid-feedback error" data-for="dueDate"></div>
              </div>
              <div class="mb-0">
                <label for="edit-genre" class="form-label">Genre <span class="text-danger">*</span></label>
                <select class="form-select" id="edit-genre" name="genre" required>
                  <option value="">Choose a genre</option>
                  <option value="Fiction">Fiction</option>
                  <option value="Non-fiction">Non-fiction</option>
                  <option value="Fantasy">Fantasy</option>
                  <option value="Science Fiction">Science Fiction</option>
                  <option value="Mystery">Mystery</option>
                  <option value="Romance">Romance</option>
                  <option value="Biography">Biography</option>
                  <option value="History">History</option>
                  <option value="Science">Science</option>
                  <option value="Other">Other</option>
                </select>
                <div class="invalid-feedback error" data-for="genre"></div>
              </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary">Save changes</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <footer class="py-3 text-center text-secondary small">
    Book Lending Tracker &middot;
    <a href="https://github.com/ollagami/book-lending-tracker" target="_blank" rel="noopener noreferrer">Source code on GitHub</a>
  </footer>

  <div class="toast-message" id="toast"></div>

  <!-- JavaScript library: Bootstrap bundle -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <!-- Our own JavaScript library -->
  <script src="app.js"></script>
  <script src="books.js"></script>
</body>
</html>
