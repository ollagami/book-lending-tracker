<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lend a book</title>
  <!-- CSS library: Bootstrap -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="site-header">
    <nav class="navbar navbar-expand-md navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand fw-semibold" href="index.html">Book Lending Tracker</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#main-nav" aria-controls="main-nav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="main-nav">
          <ul class="navbar-nav me-auto">
            <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link active" aria-current="page" href="add.html">Lend a book</a></li>
            <li class="nav-item"><a class="nav-link" href="books.html">Lent books</a></li>
            <li class="nav-item"><a class="nav-link" href="summary.html">Summary</a></li>
          </ul>
          <span class="navbar-text clock" id="clock">--:--:--</span>
        </div>
      </div>
    </nav>
  </header>

  <main class="container py-4">
    <div class="row justify-content-center">
      <div class="col-lg-7 col-md-9">

        <section class="card shadow-sm mb-4">
          <div class="card-body">
            <h2 class="h4 card-title mb-3">Lend a book</h2>

            <form id="loan-form" novalidate>
              <div class="mb-3">
                <label for="title" class="form-label">Title <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="title" name="title" placeholder="Dune" required>
                <div class="invalid-feedback error" data-for="title"></div>
              </div>
              <div class="mb-3">
                <label for="author" class="form-label">Author <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="author" name="author" placeholder="Frank Herbert" required>
                <div class="invalid-feedback error" data-for="author"></div>
              </div>
              <div class="mb-3">
                <label for="borrower" class="form-label">Borrower <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="borrower" name="borrower" placeholder="Elira" required>
                <div class="invalid-feedback error" data-for="borrower"></div>
              </div>
              <div class="mb-3">
                <label for="dueDate" class="form-label">Due date <span class="text-danger">*</span></label>
                <input type="date" class="form-control" id="dueDate" name="dueDate" required>
                <div class="invalid-feedback error" data-for="dueDate"></div>
              </div>
              <div class="mb-3">
                <label for="genre" class="form-label">Genre <span class="text-danger">*</span></label>
                <select class="form-select" id="genre" name="genre" required>
                  <option value="">Choose a genre</option>
                  <option value="Fiction">Fiction</option>
                  <option value="Non-fiction">Non-fiction</option>
                  <option value="Fantasy">Fantasy</option>
                  <option value="Science Fiction">Science Fiction</option>
                  <option value="Mystery">Mystery</option>
                  <option value="Romance">Romance</option>
                  <option value="Biography">Biography</option>
                  <option value="History">History</option>
                  <option value="Science">Science</option>
                  <option value="Other">Other</option>
                </select>
                <div class="invalid-feedback error" data-for="genre"></div>
              </div>

              <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">Add loan</button>
                <button type="reset" class="btn btn-outline-secondary">Clear</button>
              </div>
            </form>
          </div>
        </section>

        <section class="card shadow-sm d-none" id="recent">
          <div class="card-body">
            <h2 class="h5 card-title">Added just now</h2>
            <ul class="list-group list-group-flush" id="recent-list"></ul>
            <a class="btn btn-link px-0 mt-2" href="books.html">See all lent books &rarr;</a>
          </div>
        </section>

      </div>
    </div>
  </main>

  <footer class="py-3 text-center text-secondary small">
    Book Lending Tracker &middot;
    <a href="https://github.com/ollagami/book-lending-tracker" target="_blank" rel="noopener noreferrer">Source code on GitHub</a>
  </footer>

  <div class="toast-message" id="toast"></div>

  <!-- JavaScript library: Bootstrap bundle -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <!-- Our own JavaScript library -->
  <script src="app.js"></script>
  <script src="add.js"></script>
</body>
</html>
